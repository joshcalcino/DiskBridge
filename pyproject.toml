[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskbridge"
version = "0.1.0"
description = "RADMC-3D post-processor for FARGO-3D / Dusty FARGO-ADSG outputs"
readme = "README"
requires-python = ">=3.9"
license = {text = "MIT"}        # or the repo’s actual license
authors = [{name = ""}]

dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "astropy>=5.0",
  "pint>=0.21",
  "numba>=0.56",
   "healpy"
]

[project.urls]
Homepage = "https://github.com/joshcalcino/fargo2radmc3d"

[project.scripts]
# no console scripts for diskbridge yet

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["diskbridge*"]

[tool.setuptools.package-data]
diskbridge = ["data/*", "templates/*"]

