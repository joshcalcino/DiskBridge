# =============================================================================
# DISKBRIDGE CONFIGURATION
# =============================================================================
# All values with units should be specified as strings with Pint-parseable units.
# Dimensionless values are plain numbers.
# Users can override defaults by providing their own config file via
# diskbridge.load_config(path) before importing other modules.
# =============================================================================

# =============================================================================
# UNIT SYSTEMS
# =============================================================================

[units.cgs]
length = "cm"
mass = "g"
time = "s"
velocity = "cm/s"
temperature = "kelvin"
surface_density = "g/cm^2"
density = "g/cm^3"

[units.mks]
length = "m"
mass = "kg"
time = "s"
velocity = "m/s"
temperature = "kelvin"
surface_density = "kg/m^2"
density = "kg/m^3"

[units.defaults]
acceleration = "m / s ** 2"
angle = "radian"
angular_momentum = "kg * m ** 2 / s"
angular_momentum_specific = "m ** 2 / s"
density = "kg / m ** 3"
energy = "joule"
energy_specific = "joule / kg"
entropy = "joule / kelvin"
force = "newton"
frequency = "hertz"
length = "m"
magnetic_field = "tesla"
mass = "kg"
momentum = "kg * m / s"
power = "watt"
pressure = "pascal"
temperature = "kelvin"
time = "s"
velocity = "m / s"

[arrays.dimensions]
position = "length: 1"
velocity = "length: 1, time: -1"
density = "mass: 1, length: -3"
temperature = "temperature: 1"

# =============================================================================
# UNIT DEFINITIONS (registered with Pint)
# These define custom units that can be used in Pint expressions
# =============================================================================

[units.definitions]
solar_mass = "1.988461e30 kg"
solar_radius = "6.959500e8 m"
solar_luminosity = "3.8525e33 erg/s"
solar_temperature = "5.780e3 K"
earth_mass = "5.979e24 kg"
earth_radius = "6.371315e6 m"
jupiter_mass = "1.89813e27 kg"
jupiter_radius = "7.1492e7 m"
pc = "3.08567758e16 m"
au = "1.49597871e11 m"
T_CMB = "2.725 K"

# =============================================================================
# PHYSICAL CONSTANTS (registered with Pint)
# These define physical constants accessible via units('name')
# =============================================================================

[units.constants]
G = "6.67430e-8 cm**3 / (g s**2)"
sigma_SB = "5.670374419e-5 erg / (cm**2 s K**4)"
c = "2.99792458e10 cm/s"
m_H = "1.6735575e-24 g"
h = "6.62607015e-27 erg s"
k_B = "1.380649e-16 erg/K"
R_gas = "8.314462618 J / (mol K)"

# =============================================================================
# ASTRONOMICAL CONSTANTS (for _constants.py, CGS float values)
# =============================================================================

[astronomical]
solar_mass = "1.988461e30 kg"
solar_radius = "6.959500e8 m"
solar_luminosity = "3.8525e33 erg/s"
solar_temperature = "5780.0 K"
earth_mass = "5.979e24 kg"
earth_radius = "6.371315e6 m"
jupiter_mass = "1.89813e27 kg"
jupiter_radius = "7.1492e7 m"
parsec = "3.08567758e16 m"
au = "1.49597871e11 m"
T_cmb = "2.725 K"

# =============================================================================
# COMMON CHEMISTRY PARAMETERS
# Shared across all chemistry models - elemental abundances, molecular properties
# =============================================================================

[chemistry.common]
# Elemental abundances (relative to H nuclei)
X_C_tot = 1.4e-4               # Total carbon abundance (C + C+ + CO + ...)
X_O_tot = 3.0e-4               # Total oxygen abundance

# CO molecular properties
E_bind_co = "855.0 K"          # CO binding energy to grain surface
nu0_co = "1.0e12 Hz"           # Thermal desorption attempt frequency
sigma_d_per_H = "1.0e-21 cm^2" # Dust cross-section per H nucleus

# =============================================================================
# PINTE SWITCHES MODEL
# Simple threshold-based abundance switches (Pinte et al. style)
# =============================================================================

[chemistry.pinte_switches]
T_frz = "21.0 K"               # Freeze-out temperature threshold
eps_frz = 8.0e-5               # Residual gas-phase fraction after freeze-out
log_chi_over_nH_pdiss = -6.0   # log10(chi/nH) threshold for photodissociation
log_chi_over_nH_pdes = -7.0    # log10(chi/nH) threshold for photodesorption
eps_chi = 1.0e-99              # Numerical floor for chi/nH ratio

# =============================================================================
# CO TWO-PHASE MODEL
# Time-dependent gas-ice partitioning with formation/destruction rates
# =============================================================================

[chemistry.co_two_phase]
tau_co_form = "1.0e5 yr"       # CO formation timescale
k0_co = "2.0e-10 s^-1"         # Unshielded CO photodissociation rate
alpha_pd_ice = 1.0e-12         # Photodesorption yield (molecules per photon)

# Density-capped tau_form model parameters
tau_form_n0 = "1.0e4 cm^-3"    # Reference density for density-capped model
tau_form_tau0 = "1.0e5 yr"     # tau_form at reference density
tau_form_tau_min = "1.0e3 yr"  # Minimum tau_form in dense gas
tau_form_alpha = 1.0           # Density scaling exponent

# =============================================================================
# COMMON THERMAL PARAMETERS
# Shared across thermal balance models
# =============================================================================

[thermal.common]
# Carbon ionization and cooling
gamma_cii = "2.3e-3 cm^3/s"    # C+ fine-structure excitation rate coefficient
E_cii = "91.2 K"               # C+ 158um line excitation energy
n_crit_cii = "3.0e3 cm^-3"     # Critical density for C+ cooling
alpha_rec_c0 = "4.67e-12 cm^3/s"  # C+ recombination rate at 300K
T_rec_exp = -0.6               # Temperature exponent for recombination

# C I cooling (609 um and 370 um lines)
gamma_ci10 = "2.8e-10 cm^3/s"  # C I (1-0) 609um excitation rate coefficient
E_ci10 = "23.6 K"              # C I (1-0) excitation energy
n_crit_ci10 = "5.0e2 cm^-3"    # Critical density for CI 609um
gamma_ci21 = "7.1e-10 cm^3/s"  # C I (2-1) 370um excitation rate coefficient
E_ci21 = "62.5 K"              # C I (2-1) excitation energy
n_crit_ci21 = "3.0e3 cm^-3"    # Critical density for CI 370um

# O I cooling (63 um and 145 um lines)
gamma_oi63 = "5.0e-10 cm^3/s"  # O I 63um excitation rate coefficient
E_oi63 = "228.0 K"             # O I 63um excitation energy
n_crit_oi63 = "5.0e5 cm^-3"    # Critical density for OI 63um
gamma_oi145 = "1.4e-10 cm^3/s" # O I 145um excitation rate coefficient
E_oi145 = "326.0 K"            # O I 145um excitation energy
n_crit_oi145 = "1.0e5 cm^-3"   # Critical density for OI 145um

# CO rotational cooling
L_co_coeff = "1.0e-27 erg cm^3/s"  # CO cooling function coefficient

# Dust properties for gas-dust coupling
sigma_dust = "1.0e-21 cm^2"    # Dust geometric cross-section per H
f_dust = 0.01                  # Dust-to-gas mass ratio

# =============================================================================
# THERMAL BALANCE MODEL
# =============================================================================

[thermal.thermal_balance]
# Term selection (default: all available terms)
heating_terms = ["photoelectric", "cosmic_ray"]
cooling_terms = ["cii", "ci", "oi", "co"]
exchange_terms = ["gas_dust"]

# Cosmic ray heating
zeta_cr = "1.0e-17 s^-1"       # Cosmic ray ionization rate
heating_per_cr = "3.204e-11 erg"  # Heating per CR ionization (20 eV)

# Photoelectric heating
pe_heating_rate_0 = "1.3e-24 erg/s"  # PE heating rate coefficient
pah_scale = 1.0                # PAH abundance scaling factor

# Carbon photoionization
Gamma_C0 = "3.0e-10 s^-1"      # C photoionization rate at chi=1

# Accretion heating
alpha_acc = 0.3                # Accretion heating efficiency

# Escape probabilities for all cooling lines
beta_cii = 1.0                 # C+ escape probability
beta_ci10 = 1.0                # C I 609um escape probability
beta_ci21 = 1.0                # C I 370um escape probability
beta_oi63 = 1.0                # O I 63um escape probability
beta_oi145 = 1.0               # O I 145um escape probability
beta_co = 1.0                  # CO rotational escape probability

# Solver parameters
T_min = "2.0 K"          # Minimum temperature for solver
T_max = "5000.0 K"       # Maximum temperature for solver
n_iter = 3                     # Number of thermal iterations
tol = 0.01                     # Convergence tolerance
max_bisect_iter = 60           # Maximum bisection iterations
bisect_tol = 1.0e-6            # Bisection tolerance
