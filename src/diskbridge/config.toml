# =============================================================================
# DISKBRIDGE CONFIGURATION
# =============================================================================
# All values with units should be specified as strings with Pint-parseable units.
# Dimensionless values are plain numbers.
# Users can override defaults by providing their own config file via
# diskbridge.load_config(path) before importing other modules.
# =============================================================================

# =============================================================================
# UNIT SYSTEMS
# =============================================================================

[units.cgs]
length = "cm"
mass = "g"
time = "s"
velocity = "cm/s"
temperature = "kelvin"
surface_density = "g/cm^2"
density = "g/cm^3"

[units.mks]
length = "m"
mass = "kg"
time = "s"
velocity = "m/s"
temperature = "kelvin"
surface_density = "kg/m^2"
density = "kg/m^3"

[units.defaults]
acceleration = "m / s ** 2"
angle = "radian"
angular_momentum = "kg * m ** 2 / s"
angular_momentum_specific = "m ** 2 / s"
density = "kg / m ** 3"
energy = "joule"
energy_specific = "joule / kg"
entropy = "joule / kelvin"
force = "newton"
frequency = "hertz"
length = "m"
magnetic_field = "tesla"
mass = "kg"
momentum = "kg * m / s"
power = "watt"
pressure = "pascal"
temperature = "kelvin"
time = "s"
velocity = "m / s"

[arrays.dimensions]
position = "length: 1"
velocity = "length: 1, time: -1"
density = "mass: 1, length: -3"
temperature = "temperature: 1"

# =============================================================================
# UNIT DEFINITIONS (registered with Pint)
# These define custom units that can be used in Pint expressions
# =============================================================================

[units.definitions]
solar_mass = "1.988461e30 kg"
solar_radius = "6.959500e8 m"
solar_luminosity = "3.8525e33 erg/s"
solar_temperature = "5.780e3 K"
earth_mass = "5.979e24 kg"
earth_radius = "6.371315e6 m"
jupiter_mass = "1.89813e27 kg"
jupiter_radius = "7.1492e7 m"
pc = "3.08567758e16 m"
au = "1.49597871e11 m"
T_CMB = "2.725 K"

# =============================================================================
# PHYSICAL CONSTANTS (registered with Pint)
# These define physical constants accessible via units('name')
# =============================================================================

[units.constants]
G = "6.67430e-8 cm**3 / (g s**2)"
sigma_SB = "5.670374419e-5 erg / (cm**2 s K**4)"
c = "2.99792458e10 cm/s"
m_H = "1.6735575e-24 g"
h = "6.62607015e-27 erg s"
k_B = "1.380649e-16 erg/K"
R_gas = "8.314462618 J / (mol K)"

# =============================================================================
# ASTRONOMICAL CONSTANTS (for _constants.py, CGS float values)
# =============================================================================

[astronomical]
solar_mass = "1.988461e30 kg"
solar_radius = "6.959500e8 m"
solar_luminosity = "3.8525e33 erg/s"
solar_temperature = "5780.0 K"
earth_mass = "5.979e24 kg"
earth_radius = "6.371315e6 m"
jupiter_mass = "1.89813e27 kg"
jupiter_radius = "7.1492e7 m"
parsec = "3.08567758e16 m"
au = "1.49597871e11 m"
T_cmb = "2.725 K"

# =============================================================================
# COMMON CHEMISTRY PARAMETERS
# Shared across all chemistry models - elemental abundances, molecular properties
# =============================================================================

[chemistry.common]
# Elemental abundances (relative to H nuclei)
X_C_tot = 1.6e-4               # Total carbon abundance (C + C+ + CO + ...)
X_O_tot = 3.2e-4               # Total oxygen abundance

# CO molecular properties
E_bind_co = "855.0 K"          # CO binding energy to grain surface
nu0_co = "1.0e12 Hz"           # Thermal desorption attempt frequency

# CO surface / photodesorption parameters (used by gow17 enable_co_phase)
F_DRAINE = "2.0e8 1/(cm^2 s)"  # Draine UV photon flux for chi=1
N_LAY = 2                      # Number of active ice layers
n_surf = "1.5e15 1/cm^2"       # Surface site density
Y_CO = 1.0e-3                  # CO photodesorption yield (molecules/photon)

[radmc3d.uv_products]
enabled = true
mode = "disc_segment_only"
outer_product_policy = "draine_equivalent"
register_measured_mask = true
stellar_fraction_threshold = 0.01

[radmc3d.uv_products.bands]
broad_nm = [91.2, 206.7]
hard_nm = [91.2, 111.8]
c_ion_nm = [91.2, 110.1]
co_pdes_nm = [91.2, 205.0]

[radmc3d.uv_products.weights]
broad = "energy"
hard = "photon"
c_ion = "photon"
co_pdes = "photon"

[chemistry.gow17]
use_uv_products = true
hard_uv_for_directional_shielding = true
enable_co_phase = true
chi_is_incident = false
rhs_residual_warn = 1.0e6
isDust_cooling = true

[chemistry.gow17.temperature]
mode = "computed"
constant_debug_Tgas = "20 K"
Tgas_floor = "2.7 K"
Tgas_ceiling = "1.0e5 K"
max_thermal_iterations = 50
thermal_rtol = 1.0e-3
thermal_atol = "1.0e-3 K"

[chemistry.gow17.tolerances]
abstol_default = 1.0e-18
abstol_CO = 1.0e-20
abstol_CO_ice = 1.0e-20
abstol_Cplus = 1.0e-20
abstol_HCOplus = 1.0e-22
abstol_e = 1.0e-22
abstol_H2 = 1.0e-10

[chemistry.gow17.dust]
sigma_d_CO_per_H_source = "radmc"
sigma_d_CO_per_H_constant = "1.0e-21 cm^2"
Zd_gow17_grain_source = "gas_dust_ratio"
Zd_gow17_grain_constant = 1.0
sigma_d_ISM_ref = "1.0e-21 cm^2"
allow_median_sigma_ref = false

[chemistry.gow17.co_phase]
S_CO = 1.0
S_CO_mode = "constant"
enable_cruv_pdes = true
F_CRUV_CO_pdes_ref = "1.0e4 1/(cm^2 s)"
zeta_ref = "1.0e-17 1/s"
cruv_scales_with_zeta = true
enable_crdes_CO = false
k_crdes_CO = "0.0 1/s"

# =============================================================================
# PINTE SWITCHES MODEL
# Simple threshold-based abundance switches (Pinte et al. style)
# =============================================================================

[chemistry.pinte_switches]
T_frz = "21.0 K"               # Freeze-out temperature threshold
eps_frz = 8.0e-5               # Residual gas-phase fraction after freeze-out
log_chi_over_nH_pdiss = -6.0   # log10(chi/nH) threshold for photodissociation
log_chi_over_nH_pdes = -7.0    # log10(chi/nH) threshold for photodesorption
eps_chi = 1.0e-99              # Numerical floor for chi/nH ratio

# =============================================================================
# ABUNDANCE SWITCHES MODEL
# Fortran-style vertical-column thresholds (layered CO prescription)
# =============================================================================

[chemistry.layered_column_switches]
CD_threshold_pdes = "1.272e21 1/cm^2"      # 0.8 * 1.59e21
CD_threshold_pdiss = "8.268e20 1/cm^2"    # 0.8 * 1.59e21 * 0.65
